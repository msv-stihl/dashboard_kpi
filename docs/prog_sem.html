<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programação Semanal de OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F3;
    --surface:#FFFFFF;
    --surface-muted:#FAFAF8;
    --border:#E3E5E1;
    --border-soft:#ECEDEA;
    --ink:#1A1E22;
    --ink-soft:#5C6470;
    --ink-faint:#9AA1AC;

    --highlight:#DD8B2E;
    --highlight-soft:#FBF1E2;

    --st-pending:#8B93A1;
    --st-pending-bg:#EEF0F2;
    --st-progress:#FFD65A;
    --st-progress-bg:#FBF0DE;
    --st-evaluation:#B4E1EB;
    --st-evaluation-bg:#E8F6F9;
    --st-done:#3F8F5F;
    --st-done-bg:#E9F4ED;

    --load-ok:#3F8F5F;
    --load-warn:#C2811C;
    --load-over:#C1473F;

    --oficina-color:#3C6E8F;

    --weekend-bg:#23262C;
    --weekend-bg-head:#1B1E23;
    --weekend-border:#34373E;
    --weekend-ink:#F2F1ED;
    --weekend-ink-soft:#B9BCC3;
    --weekend-ink-faint:#7E828B;

    --radius:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .app{
    display:flex;
    min-height:100vh;
    max-width:1500px;
    margin:0 auto;
  }

  /* ---------------- Sidebar ---------------- */
  .sidebar{
    width:228px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:22px 12px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .sidebar-head{
    font-family:var(--font-mono);
    font-size:10.5px;
    font-weight:500;
    letter-spacing:0.1em;
    color:var(--ink-faint);
    text-transform:uppercase;
    padding:0 12px 12px;
  }
  .oficina-item{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:1px;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    border-radius:6px;
    padding:9px 11px;
    cursor:pointer;
    font-family:var(--font-body);
    color:var(--ink-soft);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .oficina-item:hover{ background:var(--surface-muted); }
  .oficina-item .o-name{ font-size:13.5px; font-weight:500; }
  .oficina-item .o-size{ font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); }
  .oficina-item.active{
    background:var(--surface-muted);
    border-left-color:var(--item-color);
    color:var(--ink);
  }
  .oficina-item.active .o-name{ color:var(--item-color); font-weight:600; }
  .oficina-item:focus-visible{ outline:2px solid var(--item-color); outline-offset:-2px; }

  .subteam-list{
    display:flex;
    flex-direction:column;
    gap:1px;
    margin:2px 0 8px 17px;
    padding-left:9px;
    border-left:1px solid var(--border-soft);
  }
  .subteam-item{
    text-align:left;
    background:transparent;
    border:none;
    border-radius:5px;
    padding:6px 10px;
    cursor:pointer;
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--ink-soft);
    transition:background .15s ease, color .15s ease;
  }
  .subteam-item:hover{ background:var(--surface-muted); }
  .subteam-item.active{ background:var(--surface-muted); color:var(--item-color); font-weight:600; }
  .subteam-item:focus-visible{ outline:2px solid var(--item-color); outline-offset:-2px; }

  /* ---------------- Main ---------------- */
  .main{
    flex:1;
    min-width:0;
    padding:26px 32px 60px;
  }

  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .topbar-left{
    display:flex;
    align-items:flex-start;
    gap:14px;
    flex-wrap:wrap;
  }
  .btn-back{
    height:42px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:0 14px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    font:600 13px var(--font-body);
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn-back:hover{
    background:var(--surface-muted);
    border-color:var(--oficina-color);
    color:var(--oficina-color);
  }
  .btn-back:focus-visible{ outline:2px solid var(--oficina-color); outline-offset:2px; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{
    width:44px;height:44px;
    border-radius:9px;
    background:var(--oficina-color);
    color:#fff;
    font-family:var(--font-mono);
    font-weight:600;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    letter-spacing:0.3px;
    flex-shrink:0;
    transition:background .2s ease;
  }
  .brand h1{
    font-family:var(--font-display);
    font-size:21px;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }
  .brand p{ margin:2px 0 0; font-size:13px; color:var(--ink-soft); }

  .week-summary{ text-align:right; }
  .summary-total{ font-family:var(--font-mono); font-size:13px; color:var(--ink-soft); }
  .summary-total b{ color:var(--ink); font-weight:600; font-size:14px; }
  .summary-load{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }

  /* ---------------- Controls ---------------- */
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:14px;
    padding:13px 18px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  .week-nav{ display:flex; align-items:center; gap:14px; }
  .nav-arrow{
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-muted);
    color:var(--oficina-color);
    font-size:17px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
    flex-shrink:0;
  }
  .nav-arrow:hover{ background:var(--highlight-soft); border-color:var(--oficina-color); }
  .nav-arrow:focus-visible{ outline:2px solid var(--oficina-color); outline-offset:2px; }

  .week-range{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:600;
    min-width:230px;
    text-align:center;
    letter-spacing:-0.01em;
  }
  .week-range .week-tag{
    display:block;
    font-family:var(--font-mono);
    font-size:10.5px;
    font-weight:500;
    color:var(--highlight);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-top:2px;
    height:13px;
  }
  .week-range .week-tag.is-loading{
    position:relative;
    padding-right:18px;
  }
  .week-range .week-tag.is-loading::after{
    content:'';
    position:absolute;
    top:50%;
    right:0;
    width:12px;
    height:12px;
    margin-top:-6px;
    border-radius:50%;
    border:2px solid rgba(221,139,46,.24);
    border-top-color:var(--highlight);
    animation:spin .8s linear infinite;
  }
  .btn-current{
    font-family:var(--font-body); font-size:13px; font-weight:600;
    color:var(--oficina-color); background:var(--highlight-soft);
    border:1px solid transparent; border-radius:8px; padding:9px 16px;
    cursor:pointer; white-space:nowrap;
    transition:filter .15s ease;
  }
  .btn-current:hover{ filter:brightness(0.96); }
  .btn-current:disabled{ background:transparent; border:1px solid var(--border); color:var(--ink-faint); cursor:default; }
  .btn-current:focus-visible{ outline:2px solid var(--oficina-color); outline-offset:2px; }

  .status-legend{ display:flex; gap:16px; flex-wrap:wrap; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); font-family:var(--font-mono); }
  .legend-item::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--dot); flex-shrink:0; }

  /* ---------------- Semana lado a lado ---------------- */
  .week-grid{
    display:grid;
    grid-template-columns:repeat(7, minmax(150px, 1fr));
    gap:10px;
    align-items:stretch;
    overflow-x:auto;
    padding-bottom:6px;
    opacity:1;
    transition:opacity .12s ease;
    position:relative;
    min-height:200px;
  }
  .week-grid.fading{ opacity:0; }
  .week-grid.is-loading::before{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(245,246,243,.62);
    border-radius:var(--radius);
    z-index:8;
    backdrop-filter:blur(1px);
  }
  .week-grid.is-loading::after{
    content:'';
    position:absolute;
    top:18px;
    right:18px;
    width:26px;
    height:26px;
    border-radius:50%;
    border:3px solid rgba(60,110,143,.18);
    border-top-color:var(--oficina-color);
    animation:spin .8s linear infinite;
    z-index:9;
  }

  .day-section{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:180px;
  }
  .day-section.is-today{ border-color:var(--oficina-color); }

  .day-head{
    display:flex;
    flex-direction:column;
    gap:7px;
    padding:11px 12px 10px;
    background:var(--surface-muted);
    border-bottom:1px solid var(--border-soft);
  }
  .day-section.is-today .day-head{ background:var(--highlight-soft); }
  .day-title{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .day-name{ font-family:var(--font-display); font-size:11.5px; font-weight:600; letter-spacing:0.02em; text-transform:uppercase; }
  .day-section.is-today .day-name{ color:var(--highlight); }
  .day-date{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); }

  .day-load{ display:flex; flex-direction:column; gap:4px; }
  .day-hh{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft); }
  .day-hh b{ color:var(--ink); font-weight:600; }
  .load-bar-row{ display:flex; align-items:center; gap:6px; }
  .load-bar-track{ flex:1; height:4px; border-radius:3px; background:var(--border-soft); overflow:hidden; }
  .load-bar-fill{ height:100%; border-radius:3px; }
  .load-pct{ font-family:var(--font-mono); font-size:10.5px; font-weight:600; min-width:30px; text-align:right; }
  .load-na{ font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); }

  .day-rows{ flex:1; display:flex; flex-direction:column; }

  .os-row{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:5px;
    padding:9px 10px 9px 16px;
    border-bottom:1px solid var(--border-soft);
    background:var(--status-bg, var(--surface));
    color:var(--status-fg, var(--ink));
    transition:filter .15s ease, transform .15s ease;
  }
  .os-row.has-details{ cursor:pointer; }
  .os-row.has-details:hover{ filter:brightness(.985); }
  .day-rows .os-row:last-child{ border-bottom:none; }
  .os-row::before{
    content:'';
    position:absolute;
    left:5px; top:8px; bottom:8px;
    width:4px;
    border-radius:2px;
    background:var(--status-color);
  }

  .os-info{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .os-code{ font-family:var(--font-mono); font-size:9.5px; color:var(--status-muted, var(--ink-faint)); }
  .os-title{ font-size:12px; line-height:1.32; color:var(--status-fg, var(--ink)); }

  .os-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .os-hh{ font-family:var(--font-mono); font-size:11px; color:var(--status-fg, var(--ink)); white-space:nowrap; }
  .os-exec{ font-family:var(--font-mono); font-size:11px; color:var(--status-muted, var(--ink-soft)); white-space:nowrap; }
  .os-resources{ display:flex; gap:4px; flex-wrap:wrap; }
  .os-detail{
    display:none;
    margin-top:2px;
    padding:8px 10px;
    border-radius:8px;
    background:var(--detail-bg, var(--surface-muted));
    border:1px solid var(--detail-border, var(--border-soft));
    font-size:11px;
    line-height:1.45;
    color:var(--status-muted, var(--ink-soft));
  }
  .os-row.is-open .os-detail{ display:block; }
  .resource-tag{
    font-size:10px;
    font-family:var(--font-body);
    font-weight:500;
    color:var(--status-muted, var(--ink-soft));
    background:var(--chip-bg, var(--surface));
    border:1px solid var(--chip-border, var(--border));
    border-radius:999px;
    padding:2px 8px;
    white-space:nowrap;
  }
  .order-badge{
    font-size:10px;
    font-family:var(--font-body);
    font-weight:700;
    letter-spacing:.02em;
    text-transform:uppercase;
    color:var(--status-fg, var(--ink));
    background:var(--chip-bg, var(--surface));
    border:1px solid var(--chip-border, var(--border));
    border-radius:999px;
    padding:2px 8px;
    white-space:nowrap;
  }
  .resource-empty{ font-family:var(--font-mono); font-size:11px; color:var(--status-muted, var(--ink-faint)); }

  .day-empty{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:16px 10px;
    font-size:10.5px;
    color:var(--ink-faint);
  }

  /* ---------------- Fim de semana em destaque ---------------- */
  .day-section.is-weekend{
    background:var(--weekend-bg);
    border-color:var(--weekend-border);
    --st-pending:#A7AEBA;
    --st-progress:#E2A23E;
    --st-done:#4FAE73;
    --load-ok:#4FAE73;
    --load-warn:#E2A23E;
    --load-over:#D9605A;
  }
  .day-section.is-weekend .day-head{ background:var(--weekend-bg-head); border-bottom-color:var(--weekend-border); }
  .day-section.is-weekend .day-name{ color:var(--weekend-ink); }
  .day-section.is-weekend .day-date{ color:var(--weekend-ink-soft); }
  .day-section.is-weekend .day-hh{ color:var(--weekend-ink-soft); }
  .day-section.is-weekend .day-hh b{ color:var(--weekend-ink); }
  .day-section.is-weekend .load-na{ color:var(--weekend-ink-soft); }
  .day-section.is-weekend .load-bar-track{ background:var(--weekend-border); }
  .day-section.is-weekend .os-row{ border-bottom-color:var(--weekend-border); }
  .day-section.is-weekend .day-empty{ color:var(--weekend-ink-faint); }
  .day-section.is-weekend.is-today{ border-color:var(--oficina-color); }
  .day-section.is-weekend.is-today .day-head{ background:var(--weekend-bg-head); border-bottom-color:var(--oficina-color); }
  .day-section.is-weekend.is-today .day-name{ color:var(--highlight); }

  @media (max-width: 900px){
    .app{ flex-direction:column; }
    .sidebar{
      width:100%;
      flex-direction:row;
      overflow-x:auto;
      border-right:none;
      border-bottom:1px solid var(--border);
      padding:14px 12px;
      gap:6px;
    }
    .sidebar-head{ display:none; }
    .oficina-item{
      flex-shrink:0;
      border-left:none;
      border-bottom:3px solid transparent;
      white-space:nowrap;
    }
    .oficina-item.active{ border-bottom-color:var(--item-color); }
    .subteam-list{
      flex-direction:row;
      margin:0 0 0 4px;
      padding-left:8px;
      border-left:1px solid var(--border-soft);
    }
    .main{ padding:20px 16px 40px; }
    .week-grid{ grid-template-columns:none; grid-auto-flow:column; grid-auto-columns:74%; }
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }
</style>
</head>
<body>

<div class="app">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-head">Oficinas</div>
  </nav>

  <div class="main">

    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-back" id="backToDashboardBtn" type="button">← Voltar ao dashboard</button>
        <div class="brand">
          <div class="brand-mark" id="brandMark"></div>
          <div>
            <h1 id="oficinaTitle"></h1>
            <p id="oficinaSubtitle"></p>
          </div>
        </div>
      </div>
      <div class="week-summary">
        <div class="summary-total" id="summaryTotal"></div>
        <div class="summary-load" id="summaryLoad"></div>
      </div>
    </header>

    <div class="controls">
      <div class="week-nav">
        <button class="nav-arrow" id="prevWeek" aria-label="Semana anterior">‹</button>
        <div class="week-range">
          <span id="weekRangeText"></span>
          <span class="week-tag" id="weekTag"></span>
        </div>
        <button class="nav-arrow" id="nextWeek" aria-label="Próxima semana">›</button>
      </div>
      <button class="btn-current" id="currentWeekBtn">Semana atual</button>
      <div class="status-legend">
        <span class="legend-item" style="--dot:#D9605A">Não executada</span>
        <span class="legend-item" style="--dot:var(--st-evaluation)">Avaliação</span>
        <span class="legend-item" style="--dot:var(--st-progress)">Em execução</span>
        <span class="legend-item" style="--dot:var(--st-done)">Concluída</span>
      </div>
    </div>

    <div class="week-grid" id="weekList"></div>

  </div>
</div>

<script src="./config.js"></script>
<script>
(function(){

  /* ---------------- Oficinas ---------------- */
  const DEFAULT_JOURNEY = { days:[1,2,3,4,5], hours:8.8 }; // seg. a sex.

  const OFICINAS = [
    { id:'civil',     label:'Civil',                 size:6,  accent:'#8C7A5E' },
    { id:'elet',      label:'Elétrica',               size:5,  accent:'#2F4D7A' },
    { id:'refrig',    label:'Refrigeração',           size:7,  accent:'#2E8B9E' },
    { id:'pintura',   label:'Pintura',                size:2,  accent:'#A8552D' },
    { id:'util',      label:'Utilidades',             accent:'#3C6E8F',
      subteams:[
        { id:'t1',  label:'T1',  size:1, journey:{ days:[1,2,3,4,5,6], hours:7.33 } },
        { id:'t2',  label:'T2',  size:1, journey:{ days:[1,2,3,4,5,6], hours:7.33 } },
        { id:'t2a', label:'T2A', size:1, journey:{ days:[1,2,3,4,5],   hours:8.8  } },
        { id:'t3',  label:'T3',  size:1, journey:{ days:[1,2,3,4,5,6], hours:7.33 } },
      ]
    },
    { id:'spci',      label:'SPCI',                   size:5,  accent:'#C1473F' },
    { id:'limpTec',   label:'Limpeza Técnica',        size:5,  accent:'#6B7B93' },
    { id:'jardim',    label:'Jardinagem',              size:4,  accent:'#4F7942' },
    { id:'limpConv',  label:'Limpeza Convencional',   accent:'#9B6E9E',
      subteams:[
        { id:'t1', label:'T1',         size:8  },
        { id:'t2', label:'T2 / T2E',   size:22 },
        { id:'t3', label:'T3 / T3E',   size:21 },
      ]
    },
  ];

  const STATUS = {
    pending:  { label:'Não executada', color:'var(--st-pending)',  bg:'var(--st-pending-bg)'  },
    evaluation: { label:'Avaliação',   color:'var(--st-evaluation)', bg:'var(--st-evaluation-bg)' },
    progress: { label:'Em execução',   color:'var(--st-progress)', bg:'var(--st-progress-bg)' },
    done:     { label:'Concluída',     color:'var(--st-done)',     bg:'var(--st-done-bg)'     },
  };

  const WEEKDAY_ABBR = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
  const MONTHS_FULL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const MONTHS_ABBR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

  /* ---------------- Dados de exemplo por oficina ---------------- */
  // o = offset em dias relativos a hoje | hh = horas estimadas da OS | ex = qtd executantes alocados
  const RAW = {
    civil:[

  function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+n); return d; }

  function buildOrder(o){
    return {
      date: addDays(today, o.o),
      code: 'OS-'+yearForCode+'-'+o.n,
      title: o.t,
      hh: o.hh,
      exec: o.ex,
      tipoServico: Number(o?.ts ?? 1) || 1,
      status: o.st,
      resources: o.r,
    };
  }

  function makeEmptyData(){
    const out = {};
    OFICINAS.forEach(of=>{
      if(of.subteams){
        out[of.id] = {};
        of.subteams.forEach(st=>{ out[of.id][st.id] = []; });
      } else {
        out[of.id] = [];
      }
    });
    return out;
  }

  function normalizeOrderFromApi(o){
    const dateIso = String(o?.date ?? '').slice(0, 10);
    const date = dateIso ? new Date(dateIso + 'T00:00:00') : new Date();
    date.setHours(0,0,0,0);
    return {
      date,
      code: String(o?.code ?? '').trim() || 'OS',
      title: String(o?.title ?? '').trim() || 'Ordem de Serviço',
      description: String(o?.description ?? '').trim(),
      hh: Number(o?.hh ?? 0) || 0,
      exec: Number(o?.exec ?? 1) || 1,
      tipoServico: Number(o?.tipoServico ?? 0) || 0,
      estado: Number(o?.estado ?? 0) || 0,
      status: String(o?.status ?? 'pending'),
      resources: Array.isArray(o?.resources) ? o.resources.map(r=>String(r ?? '').trim()).filter(Boolean) : [],
    };
  }

  function getOrderBadgeLabel(order){
    const estado = Number(order?.estado ?? 0);
    if(estado === 30) return 'Avaliação';
    const tipoServico = Number(order?.tipoServico ?? 0);
    if(!Number.isFinite(tipoServico) || tipoServico <= 0) return '';
    return tipoServico > 3 ? 'Corretiva' : 'Preventiva';
  }

  function getOrderVisual(order){
    const estado = Number(order?.estado ?? 0);
    const orderDate = order?.date instanceof Date ? order.date : new Date(order?.date ?? '');
    const isPast = orderDate instanceof Date && !Number.isNaN(orderDate.getTime()) && orderDate < today;

    if(estado === 96){
      return {
        bg:'#7F8487',
        fg:'#FFFFFF',
        muted:'rgba(255,255,255,.82)',
        detailBg:'rgba(255,255,255,.12)',
        detailBorder:'rgba(255,255,255,.16)',
        chipBg:'rgba(255,255,255,.12)',
        chipBorder:'rgba(255,255,255,.18)'
      };
    }
    if(estado === 77 || estado === 99){
      return {
        accent:'#9AD872',
        bg:'#9AD872',
        fg:'#1A1E22',
        muted:'rgba(26,30,34,.72)',
        detailBg:'rgba(255,255,255,.34)',
        detailBorder:'rgba(26,30,34,.08)',
        chipBg:'rgba(255,255,255,.5)',
        chipBorder:'rgba(26,30,34,.1)'
      };
    }
    if(estado === 30 && isPast){
      return {
        accent:'#D9605A',
        bg:'#F7C3BD',
        fg:'#1A1E22',
        muted:'rgba(26,30,34,.72)',
        detailBg:'rgba(255,255,255,.38)',
        detailBorder:'rgba(26,30,34,.08)',
        chipBg:'rgba(255,255,255,.56)',
        chipBorder:'rgba(26,30,34,.1)'
      };

    if(estado === 30){
      return {
        accent:'var(--st-evaluation)',

        fg:'#1A1E22',
        muted:'rgba(26,30,34,.72)',

        detailBorder:'rgba(26,30,34,.08)',
        chipBg:'rgba(255,255,255,.5)',
        chipBorder:'rgba(26,30,34,.1)'
      };
    }
    if(estado === 55){
      return {
        accent:'#FFD65A',
        bg:'#FFD65A',
        fg:'#1A1E22',
        muted:'rgba(26,30,34,.72)',
        detailBg:'rgba(255,255,255,.36)',

        chipBg:'rgba(255,255,255,.52)',

  function _sleep(ms){ return new Promise((r)=>setTimeout(r, ms)); }

  async function _withRetries(fn, { maxRetries = _FETCH_MAX_RETRIES, baseDelay = _FETCH_RETRY_BASE_DELAY } = {}){
    let lastErr = null;
    for(let attempt = 0; attempt <= maxRetries; attempt++){
      try{ return await fn(attempt); }
      catch(err){
        lastErr = err;
        if(attempt >= maxRetries) break;
        const delay = baseDelay * Math.pow(2, attempt) + Math.floor(Math.random() * 500);
        await _sleep(delay);
      }
    }
    throw lastErr;
  }

  function fetchJsonp(urlString, { timeoutMs = _FETCH_TIMEOUT_MS } = {}){
    return new Promise((resolve, reject)=>{
      const cbParam = String(cfg.jsonpCallbackParam || 'callback');
      const cbName = '__jsonp_cb_' + Date.now() + '_' + Math.random().toString(16).slice(2);
      const url = new URL(urlString);
      url.searchParams.set(cbParam, cbName);

      let done = false;
      const cleanup = ()=>{
        if(done) return;
        done = true;
        try{ delete window[cbName]; } catch {}
        if(script && script.parentNode) script.parentNode.removeChild(script);
        if(timer) clearTimeout(timer);
      };

      window[cbName] = (payload)=>{
        cleanup();
        resolve(payload);
      };

      const script = document.createElement('script');
      script.src = url.toString();
      script.async = true;
      script.onerror = ()=>{
        cleanup();
        reject(new Error('Falha no JSONP'));
      };

      const timer = setTimeout(()=>{
        cleanup();
        reject(new Error('Timeout no JSONP'));
      }, timeoutMs);

      document.head.appendChild(script);
    });
  }

  function _fetchWithTimeout(url, options = {}, timeoutMs = _FETCH_TIMEOUT_MS){
    const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
    const signal = controller ? controller.signal : undefined;
    const opts = signal ? { ...options, signal } : { ...options };
    let timeoutId = null;
    const cleanup = ()=>{ if(timeoutId){ clearTimeout(timeoutId); timeoutId = null; } };
    const timeoutPromise = new Promise((_, reject)=>{
      timeoutId = setTimeout(()=>{
        if(controller){ try{ controller.abort(); }catch{} }
        reject(new Error('Timeout na requisição'));
      }, timeoutMs);
    });
    return Promise.race([fetch(url, opts).finally(cleanup), timeoutPromise]);
  }

  async function fetchWeekData(monday){
    if(!remoteEndpoint) return null;
    const key = monday.toISOString().slice(0, 10);
    if(remoteCache.has(key)) return remoteCache.get(key);

    const baseUrl = new URL(remoteEndpoint);
    baseUrl.searchParams.set('view', 'prog_sem');
    baseUrl.searchParams.set('weekStart', key);

    const payload = await _withRetries(async () => {
      const url = new URL(baseUrl.toString());
      const transport = String(cfg.transport || 'auto').toLowerCase();
      let result;
      if(transport === 'jsonp') result = await fetchJsonp(url.toString());
      else if(transport === 'fetch') {
        const res = await _fetchWithTimeout(url.toString(), { method:'GET', mode:'cors', cache:'no-store' });
        if(!res.ok) throw new Error('HTTP ' + res.status);
        result = await res.json();
      } else {
        try{
          result = await fetchJsonp(url.toString());
        } catch {
          const res = await _fetchWithTimeout(url.toString(), { method:'GET', mode:'cors', cache:'no-store' });
          if(!res.ok) throw new Error('HTTP ' + res.status);
          result = await res.json();
        }
      }
      return result;
    });

    remoteCache.set(key, payload);
    return payload;
  }

  async function ensureWeekData(monday){
    if(!remoteEndpoint) return false;
    const key = monday.toISOString().slice(0, 10);
    const payload = await fetchWeekData(monday);
    if(!payload || typeof payload !== 'object' || !payload.data) return false;

    const next = makeEmptyData();
    OFICINAS.forEach(of=>{
      if(of.subteams){
        of.subteams.forEach(st=>{
          const raw = payload.data?.[of.id]?.[st.id];
          next[of.id][st.id] = Array.isArray(raw) ? raw.map(normalizeOrderFromApi) : [];
        });
      } else {
        const raw = payload.data?.[of.id];
        next[of.id] = Array.isArray(raw) ? raw.map(normalizeOrderFromApi) : [];
      }
    });

    DATA = next;
    weekTagEl.dataset.week = key;
    return true;
  }

  function getMonday(date){
    const d = new Date(date);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    return addDays(d, diff);
  }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function dateKey(d){ return d.toDateString(); }
  function isWorkingDay(d, journey){ return journey.days.includes(d.getDay()); }
  function isCalendarWeekend(d){ const day = d.getDay(); return day===0 || day===6; }
  function journeyDaysLabel(days){
    const key = days.slice().sort((a,b)=>a-b).join(',');
    if(key === '1,2,3,4,5') return 'seg. a sex.';
    if(key === '1,2,3,4,5,6') return 'seg. a sáb.';
    return 'dias variáveis';
  }
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function fmt1(n){ return n.toFixed(1).replace('.', ','); }
  function fmtHH(n){ return (Number.isInteger(n) ? n : n.toFixed(1).replace('.', ',')) + 'h'; }

  /* ---------------- Estados ---------------- */
  let currentOficina = OFICINAS[0].id;
  let currentSubteam = null;
  let weekOffset = 0;

  function getActiveUnit(){
    const of = OFICINAS.find(o=>o.id===currentOficina);
    if(of.subteams){
      const st = of.subteams.find(s=>s.id===currentSubteam) || of.subteams[0];
      return { oficina:of, subteam:st, size:st.size, journey: st.journey || DEFAULT_JOURNEY, orders: DATA[of.id][st.id] };
    }
    return { oficina:of, subteam:null, size:of.size, journey: of.journey || DEFAULT_JOURNEY, orders: DATA[of.id] };
  }

  /* ---------------- Sidebar ---------------- */
  const sidebarEl = document.getElementById('sidebar');

  function refreshSidebarActive(){
    document.querySelectorAll('.oficina-item').forEach(el=>{
      el.classList.toggle('active', el.dataset.oficina===currentOficina);
    });
    document.querySelectorAll('.subteam-item').forEach(el=>{
      el.classList.toggle('active', el.dataset.oficina===currentOficina && el.dataset.subteam===currentSubteam);
    });
  }

  OFICINAS.forEach(of=>{
    const totalSize = of.subteams ? of.subteams.reduce((s,st)=>s+st.size,0) : of.size;

    const btn = document.createElement('button');
    btn.className = 'oficina-item';
    btn.style.setProperty('--item-color', of.accent);
    btn.dataset.oficina = of.id;
    btn.innerHTML = '<span class="o-name">'+of.label+'</span><span class="o-size">'+totalSize+' colaboradores</span>';
    btn.addEventListener('click', ()=>{
      currentOficina = of.id;
      currentSubteam = of.subteams ? of.subteams[0].id : null;
      refreshSidebarActive();
      render();
    });
    sidebarEl.appendChild(btn);

    if(of.subteams){
      const subWrap = document.createElement('div');
      subWrap.className = 'subteam-list';
      of.subteams.forEach(st=>{
        const sbtn = document.createElement('button');
        sbtn.className = 'subteam-item';
        sbtn.style.setProperty('--item-color', of.accent);
        sbtn.dataset.oficina = of.id;
        sbtn.dataset.subteam = st.id;
        sbtn.textContent = st.label;
        sbtn.addEventListener('click', ()=>{
          currentOficina = of.id;
          currentSubteam = st.id;
          refreshSidebarActive();
          render();
        });
        subWrap.appendChild(sbtn);
      });
      sidebarEl.appendChild(subWrap);
    }
  });

  refreshSidebarActive();

  /* ---------------- Elements ---------------- */
  const brandMarkEl = document.getElementById('brandMark');
  const oficinaTitleEl = document.getElementById('oficinaTitle');
  const oficinaSubtitleEl = document.getElementById('oficinaSubtitle');
  const summaryTotalEl = document.getElementById('summaryTotal');
  const summaryLoadEl = document.getElementById('summaryLoad');
  const weekRangeTextEl = document.getElementById('weekRangeText');
  const weekTagEl = document.getElementById('weekTag');
  const currentWeekBtn = document.getElementById('currentWeekBtn');
  const weekListEl = document.getElementById('weekList');
  const backToDashboardBtn = document.getElementById('backToDashboardBtn');
  const prevWeekBtn = document.getElementById('prevWeek');
  const nextWeekBtn = document.getElementById('nextWeek');

  function setWeekLoading(loading){
    weekListEl.classList.toggle('is-loading', loading);
    weekTagEl.classList.toggle('is-loading', loading);
    prevWeekBtn.disabled = loading;
    nextWeekBtn.disabled = loading;
    currentWeekBtn.disabled = loading || weekOffset===0;
    sidebarEl.querySelectorAll('button').forEach((btn)=>{ btn.disabled = loading; });
  }

  function formatRange(monday, sunday){
    const d1 = monday.getDate(), d2 = sunday.getDate();
    const m1 = monday.getMonth(), m2 = sunday.getMonth();
    const y1 = monday.getFullYear(), y2 = sunday.getFullYear();
    if(y1 !== y2) return d1+' de '+MONTHS_ABBR[m1]+' de '+y1+' – '+d2+' de '+MONTHS_ABBR[m2]+' de '+y2;
    if(m1 !== m2) return d1+' '+MONTHS_ABBR[m1]+' – '+d2+' '+MONTHS_ABBR[m2]+' de '+y1;
    return d1+' – '+d2+' de '+MONTHS_FULL[m1]+' de '+y1;
  }

  function loadColor(pct){
    if(pct > 100) return 'var(--load-over)';
    if(pct >= 80) return 'var(--load-warn)';
    return 'var(--load-ok)';
  }

  function goBackToDashboard(){
    const dashboardUrl = './index.html#/geral';
    window.location.replace(dashboardUrl);
  }

  async function render(){
    const monday = addDays(getMonday(today), weekOffset*7);
    const sunday = addDays(monday, 6);
    const days = Array.from({length:7}, (_,i)=>addDays(monday,i));

    let hasRemoteData = false;
    let remoteError = '';
    if(remoteEndpoint){
      setWeekLoading(true);
      weekListEl.classList.add('fading');
      try { hasRemoteData = await ensureWeekData(monday); }
      catch(e){
        remoteError = e?.message ? String(e.message) : 'Falha ao carregar dados';
        try{ console.error(e); } catch {}
      }
      if(!hasRemoteData){
        DATA = makeEmptyData();
        weekTagEl.title = remoteError;
      } else {
        weekTagEl.title = '';
      }
    }

    const unit = getActiveUnit();
    const oficina = unit.oficina;
    document.documentElement.style.setProperty('--oficina-color', oficina.accent);

    brandMarkEl.textContent = unit.subteam ? unit.subteam.label.toUpperCase() : oficina.label.slice(0,2).toUpperCase();
    oficinaTitleEl.textContent = oficina.label;
    oficinaSubtitleEl.textContent = (unit.subteam ? unit.subteam.label+' · ' : '') +
      unit.size+' '+(unit.size===1 ? 'colaborador' : 'colaboradores')+' · jornada de '+
      fmt1(unit.journey.hours)+'h/dia ('+journeyDaysLabel(unit.journey.days)+')';

    weekRangeTextEl.textContent = formatRange(monday, sunday);
    const tagBase = weekOffset===0 ? 'SEMANA ATUAL' : (weekOffset<0 ? 'SEMANA ANTERIOR' : 'PRÓXIMA SEMANA');
    weekTagEl.textContent = (remoteEndpoint && !hasRemoteData) ? (tagBase + ' • OFFLINE') : tagBase;
    currentWeekBtn.disabled = weekOffset===0;

    const ordersByDay = {};
    days.forEach(d=> ordersByDay[dateKey(d)] = []);
    unit.orders.forEach(o=>{
      const key = dateKey(o.date);
      if(key in ordersByDay) ordersByDay[key].push(o);
    });

    let weekHH = 0, weekCapacity = 0;
    days.forEach(d=>{
      const dayOrders = ordersByDay[dateKey(d)];
      const dayHH = dayOrders.reduce((sum,o)=> sum + o.hh*o.exec, 0);
      weekHH += dayHH;
      if(isWorkingDay(d, unit.journey)) weekCapacity += unit.size * unit.journey.hours;
    });
    const weekPct = weekCapacity > 0 ? Math.round(weekHH/weekCapacity*100) : 0;

    summaryTotalEl.innerHTML = '<b>'+fmt1(weekHH)+' HH</b> programadas na semana';
    summaryLoadEl.textContent = weekCapacity > 0 ? 'Carga média: '+weekPct+'% da capacidade ('+fmt1(weekCapacity)+'h)' : '—';

    weekListEl.classList.add('fading');

    setTimeout(()=>{
      weekListEl.innerHTML = '';

      days.forEach(d=>{
        const isToday = sameDay(d, today);
        const working = isWorkingDay(d, unit.journey);
        const weekendCal = isCalendarWeekend(d);
        const dayOrders = ordersByDay[dateKey(d)].slice().sort((a,b)=> a.code.localeCompare(b.code));
        const dayHH = dayOrders.reduce((sum,o)=> sum + o.hh*o.exec, 0);
        const capacity = working ? unit.size * unit.journey.hours : 0;
        const pct = capacity > 0 ? Math.round(dayHH/capacity*100) : null;

        const section = document.createElement('section');
        section.className = 'day-section' + (isToday ? ' is-today' : '') + (weekendCal ? ' is-weekend' : '');

        const head = document.createElement('div');
        head.className = 'day-head';

        const titleWrap = document.createElement('div');
        titleWrap.className = 'day-title';
        titleWrap.innerHTML = '<span class="day-name">'+WEEKDAY_ABBR[d.getDay()]+'</span>'+
          '<span class="day-date">'+pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'</span>';
        head.appendChild(titleWrap);

        const loadWrap = document.createElement('div');
        loadWrap.className = 'day-load';
        if(pct === null){
          loadWrap.innerHTML = '<span class="day-hh"><b>'+fmt1(dayHH)+' HH</b></span>'+
            '<span class="load-na">'+(dayHH>0 ? 'fora da jornada' : 'sem expediente')+'</span>';
        } else {
          const color = loadColor(pct);
          loadWrap.innerHTML =
            '<span class="day-hh"><b>'+fmt1(dayHH)+' HH</b> / '+fmt1(capacity)+'h</span>'+
            '<div class="load-bar-row">'+
              '<div class="load-bar-track"><div class="load-bar-fill" style="width:'+Math.min(pct,100)+'%; background:'+color+'"></div></div>'+
              '<span class="load-pct" style="color:'+color+'">'+pct+'%</span>'+
            '</div>';
        }
        head.appendChild(loadWrap);
        section.appendChild(head);

        const rows = document.createElement('div');
        rows.className = 'day-rows';

        if(dayOrders.length === 0){
          const empty = document.createElement('div');
          empty.className = 'day-empty';
          empty.textContent = 'Nenhuma OS programada.';
          rows.appendChild(empty);
        } else {
          dayOrders.forEach(o=>{
            const status = STATUS[o.status];
            const visual = getOrderVisual(o);
            const badgeLabel = getOrderBadgeLabel(o);
            const row = document.createElement('div');
            row.className = 'os-row' + (o.description ? ' has-details' : '');
            row.style.setProperty('--status-color', visual.accent || status.color);
            row.style.setProperty('--status-bg', visual.bg);
            row.style.setProperty('--status-fg', visual.fg);
            row.style.setProperty('--status-muted', visual.muted);
            row.style.setProperty('--detail-bg', visual.detailBg);
            row.style.setProperty('--detail-border', visual.detailBorder);
            row.style.setProperty('--chip-bg', visual.chipBg);
            row.style.setProperty('--chip-border', visual.chipBorder);

            const resourcesHtml = o.resources.length
              ? o.resources.map(r=>'<span class="resource-tag">'+r+'</span>').join('')
              : '<span class="resource-empty">—</span>';

            row.innerHTML =
              '<div class="os-info">'+
                '<span class="os-code">'+o.code+'</span>'+
                '<span class="os-title">'+o.title+'</span>'+
              '</div>'+
              '<div class="os-meta">'+
                (badgeLabel ? '<span class="order-badge">'+badgeLabel+'</span>' : '')+
                '<span class="os-hh">'+fmtHH(o.hh)+'</span>'+
                '<span class="os-exec">'+o.exec+' exec.</span>'+
                '<div class="os-resources">'+resourcesHtml+'</div>'+
              '</div>'+
              (o.description ? '<div class="os-detail">'+o.description+'</div>' : '');

            if(o.description){
              row.setAttribute('role', 'button');
              row.setAttribute('tabindex', '0');
              row.setAttribute('aria-expanded', 'false');
              const toggleDetails = ()=>{
                const isOpen = row.classList.toggle('is-open');
                row.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
              };
              row.addEventListener('click', toggleDetails);
              row.addEventListener('keydown', (event)=>{
                if(event.key === 'Enter' || event.key === ' '){
                  event.preventDefault();
                  toggleDetails();
                }
              });
            }
            rows.appendChild(row);
          });
        }

        section.appendChild(rows);
        weekListEl.appendChild(section);
      });

      weekListEl.classList.remove('fading');
      if(remoteEndpoint) setWeekLoading(false);
    }, 110);
  }

  prevWeekBtn.addEventListener('click', ()=>{ weekOffset--; render(); });
  nextWeekBtn.addEventListener('click', ()=>{ weekOffset++; render(); });
  currentWeekBtn.addEventListener('click', ()=>{ weekOffset=0; render(); });
  if(backToDashboardBtn) backToDashboardBtn.addEventListener('click', goBackToDashboard);

  render().catch(()=>{});

})();
</script>

</body>
